# OpenAPI source and generated-source layout
openApi.inputSpec=src/main/resources/graffiti.yaml
openApi.outputDirectory=generated/sources/openapi
openApi.sourceFolder=src/main/kotlin
openApi.cleanupOutput=true

# Generated packages
openApi.apiPackage=edu.cnm.deepdive.graffiti.controller
openApi.modelPackage=edu.cnm.deepdive.graffiti.model.dto

# Generator selection
openApi.generatorName=kotlin-spring

# Kotlin Spring generator options
openApi.configOptions=interfaceOnly,skipDefaultInterface,useSpringBoot4,useJackson3,useBeanValidation,documentationProvider,annotationLibrary,useSwaggerUI,openApiNullable,useResponseEntity
openApi.config.interfaceOnly=true
openApi.config.skipDefaultInterface=true
openApi.config.useSpringBoot4=true
openApi.config.useJackson3=true
openApi.config.useBeanValidation=true
openApi.config.documentationProvider=none
openApi.config.annotationLibrary=none
openApi.config.useSwaggerUI=false
openApi.config.openApiNullable=false
openApi.config.useResponseEntity=true

# Generated artifact selection
openApi.globalProperties=apis,models,supportingFiles
openApi.global.apis=
openApi.global.models=
openApi.global.supportingFiles=false

# Unwanted auxiliary output
openApi.generateApiTests=false
openApi.generateModelTests=false
openApi.generateApiDocumentation=false
openApi.generateModelDocumentation=false
